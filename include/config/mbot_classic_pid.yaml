# MBot Classic PID Configuration
# All gains are initial tuning values and may need adjustment

mbot_control_node:
  ros__parameters:
    left_wheel.kp: 0.3
    left_wheel.ki: 0.0
    left_wheel.kd: 1e-06
    left_wheel.tf: 0.5

    right_wheel.kp: 0.3
    right_wheel.ki: 0.0
    right_wheel.kd: 1e-06
    right_wheel.tf: 0.5

    control_mode: 2  # 0=FF only, 1=PID only, 2=FF+PID
